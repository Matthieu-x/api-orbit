<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina no encontrada — Orbit API</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
    gap: 18px;
    padding: 24px;
  }
  .notfound .code {
    font-family: var(--font-head);
    font-size: 84px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .notfound h1 {
    font-size: 22px;
  }
  .notfound .links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
</style>
</head>
<body>

<div class="orbit-bg">
  <svg viewBox="0 0 800 800">
    <ellipse class="orbit-ring" cx="400" cy="400" rx="320" ry="180" transform="rotate(-8 400 400)"></ellipse>
    <circle class="orbit-dot" cx="620" cy="270" r="4"></circle>
  </svg>
</div>

<div class="notfound">
  <svg width="34" height="34" viewBox="0 0 24 24" fill="none" style="color:var(--accent)">
    <ellipse cx="12" cy="12" rx="10" ry="4.2" stroke="currentColor" stroke-width="1.4" transform="rotate(-18 12 12)"></ellipse>
    <circle cx="12" cy="12" r="2.6" fill="currentColor"></circle>
  </svg>
  <span class="dashboard-badge">ERROR 404</span>
  <div class="code">404</div>
  <h1>Esta órbita no existe</h1>
  <p class="muted">La página que buscas no está disponible.</p>
  <a class="btn btn-primary" href="/">Volver al inicio</a>
  <div class="links">
    <a class="chip" href="/dashboard">Dashboard</a>
    <a class="chip" href="/docs">Documentación</a>
    <a class="chip" href="/login">Iniciar sesión</a>
  </div>
</div>

</body>
</html>
