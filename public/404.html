<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina no encontrada — Orbit API</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
    gap: 18px;
    padding: 24px;
  }
  .notfound .code {
    font-family: var(--font-head);
    font-size: 84px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .notfound h1 {
    font-size: 22px;
  }
  .notfound .links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  @media(max-width:420px){.topbar-right a.btn-ghost{display:none}.topbar-right .btn{padding:0 10px;font-size:12px}}
</style>
</head>
<body>

<div class="orbit-bg">
  <svg viewBox="0 0 800 800">
    <ellipse class="orbit-ring" cx="400" cy="400" rx="320" ry="180" transform="rotate(-8 400 400)"></ellipse>
    <circle class="orbit-dot" cx="620" cy="270" r="4"></circle>
  </svg>
</div>

<div class="topbar">
  <div class="topbar-left">
    <a class="brand" href="/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <ellipse cx="12" cy="12" rx="10" ry="4.2" stroke="currentColor" stroke-width="1.4" transform="rotate(-18 12 12)"></ellipse>
        <circle cx="12" cy="12" r="2.6" fill="var(--accent)"></circle>
      </svg>
      <span>Orbit API</span>
    </a>
    <nav class="topbar-nav-icons">
      <a class="topbar-nav-icon" href="/" title="Inicio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 001 1h10a1 1 0 001-1v-9"/></svg>
      </a>
      <a class="topbar-nav-icon" href="/docs" title="Documentación">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4 2 12l6 8"/><path d="M16 4l6 8-6 8"/></svg>
      </a>
      <a class="topbar-nav-icon" href="/terms" title="Términos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1Z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
      </a>
    </nav>
  </div>
  <div class="topbar-right">
    <a class="btn btn-ghost" href="/login">Iniciar sesión</a>
    <a class="btn btn-primary" href="/register">Crear cuenta</a>
  </div>
</div>

<div class="notfound" style="min-height:calc(100vh - 64px)">
  <span class="icon-stat-icon" style="width:56px;height:56px;border-radius:16px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8.5 11h5"/></svg>
  </span>
  <span class="dashboard-badge">ERROR 404</span>
  <div class="code">404</div>
  <h1>Esta órbita no existe</h1>
  <p class="muted">La página que buscas no está disponible.</p>
  <a class="btn btn-primary" href="/">Volver al inicio</a>
  <div class="links">
    <a class="chip" href="/dashboard">Dashboard</a>
    <a class="chip" href="/docs">Documentación</a>
    <a class="chip" href="/login">Iniciar sesión</a>
  </div>
</div>

</body>
</html>
