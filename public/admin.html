<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de admin — Orbit API</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="orbit-bg">
  <svg viewBox="0 0 800 800">
    <ellipse class="orbit-ring" cx="400" cy="400" rx="280" ry="280"></ellipse>
  </svg>
</div>

<div id="shellMount"></div>

<div class="app-shell">
  <div class="wrap" style="padding-top:30px">

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px">
      <div>
        <h1 class="section-title">Panel de admin</h1>
        <p class="muted">Gestiona las cuentas de Orbit API.</p>
      </div>
      <button class="btn btn-primary" id="openNotifBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        Enviar notificacion
      </button>
    </div>

    <div class="card">
      <div class="search-row" style="margin-top:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="userSearch" placeholder="Buscar por nombre o correo" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="orbit-user-search">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Correo</th>
              <th>Contrasena</th>
              <th>API key</th>
              <th>Solicitudes</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="usersBody">
            <tr><td colspan="6" class="muted">Cargando usuarios...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<div class="modal-backdrop" id="notifModal">
  <div class="modal">
    <h3 style="margin-bottom:16px">Enviar notificacion</h3>
    <form id="notifForm">
      <div class="field">
        <label>Titulo</label>
        <input type="text" name="title" required>
      </div>
      <div class="field">
        <label>Mensaje</label>
        <textarea name="message" rows="3" required></textarea>
      </div>
      <p class="muted" style="font-size:12.5px">Se enviara a todos los usuarios.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelNotifBtn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="addReqModal">
  <div class="modal">
    <h3 style="margin-bottom:16px">Agregar solicitudes</h3>
    <div class="field">
      <label>Cantidad a agregar</label>
      <input type="number" id="addReqInput" min="1" value="100">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="cancelAddReqBtn">Cancelar</button>
      <button type="button" class="btn btn-primary" id="confirmAddReqBtn">Agregar</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="deleteModal">
  <div class="modal">
    <h3 style="margin-bottom:10px">Eliminar cuenta</h3>
    <p class="muted" style="margin-bottom:6px">Esta accion no se puede deshacer.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="cancelDeleteBtn">Cancelar</button>
      <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
