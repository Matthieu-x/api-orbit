<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime — Orbit API</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="orbit-bg"><svg viewBox="0 0 800 800"><ellipse class="orbit-ring" cx="400" cy="400" rx="280" ry="280" transform="rotate(18 400 400)"></ellipse></svg></div>
  <div id="shellMount"></div>

  <div class="app-shell">
    <div class="wrap" style="padding-top:30px">
      <h1 class="section-title">Anime</h1>
      <p class="muted" style="margin-bottom:22px">Imágenes anime aleatorias. Requiere cuenta VIP.</p>

      <div class="download-grid">
        <div class="card endpoint-download-card vip-endpoint">
          <div>
            <span class="method">GET</span><span class="pill-vip">VIP</span>
            <h3 style="margin-top:10px">Anime Random</h3>
            <p class="muted">Imagen anime aleatoria (waifu, neko, hug, pat, etc.) vía nekos.best. Solo contenido SFW.</p>
          </div>
          <div class="field" style="margin-top:18px">
            <label>type</label>
            <select id="animeType">
              <option value="waifu">waifu</option>
              <option value="neko">neko</option>
              <option value="kitsune">kitsune</option>
              <option value="husbando">husbando</option>
              <option value="pat">pat</option>
              <option value="hug">hug</option>
              <option value="kiss">kiss</option>
              <option value="cuddle">cuddle</option>
              <option value="smile">smile</option>
              <option value="wave">wave</option>
              <option value="dance">dance</option>
              <option value="happy">happy</option>
            </select>
          </div>
          <div class="endpoint-row" id="animeEndpoint"></div>
          <div class="copy-row"><button class="btn btn-ghost" id="animeCopy">Copiar</button><button class="btn btn-primary" id="animeSend">Enviar</button></div>
          <div class="json-console" id="animeResponse">Requiere una cuenta VIP.</div>
        </div>

        <div class="card endpoint-download-card vip-endpoint">
          <div>
            <span class="method">GET</span><span class="pill-vip">VIP</span>
            <h3 style="margin-top:10px">Anime Quote</h3>
            <p class="muted">Frase aleatoria de un personaje de anime vía AnimeChan.</p>
          </div>
          <div class="field" style="margin-top:18px">
            <label>anime (opcional)</label>
            <input id="quoteAnime" placeholder="Naruto">
          </div>
          <div class="field" style="margin-top:12px">
            <label>character (opcional)</label>
            <input id="quoteCharacter" placeholder="Saitama">
          </div>
          <div class="endpoint-row" id="quoteEndpoint"></div>
          <div class="copy-row"><button class="btn btn-ghost" id="quoteCopy">Copiar</button><button class="btn btn-primary" id="quoteSend">Enviar</button></div>
          <div class="json-console" id="quoteResponse">Requiere una cuenta VIP.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/anime.js"></script>
</body>
</html>
