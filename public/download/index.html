<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Download — Orbit API</title><link rel="stylesheet" href="/css/style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></head><body><div class="orbit-bg"><svg viewBox="0 0 800 800"><ellipse class="orbit-ring" cx="400" cy="400" rx="280" ry="280" transform="rotate(18 400 400)"></ellipse></svg></div><div id="shellMount"></div><div class="app-shell"><div class="wrap" style="padding-top:30px"><h1 class="section-title">Download</h1><p class="muted" style="margin-bottom:22px">Endpoints de descarga. YouTube Audio es Free; YouTube Video requiere VIP.</p><div class="download-grid"><div class="card endpoint-download-card"><div><span class="method">GET</span><span class="pill-free" style="margin-left:6px">FREE</span><h3 style="margin-top:10px">YouTube Audio</h3><p class="muted">Descarga audio MP3.</p></div><div class="field" style="margin-top:18px"><label>url</label><input id="audioUrl" placeholder="https://youtube.com/watch?v=..."></div><div class="endpoint-row" id="audioEndpoint"></div><div class="copy-row"><button class="btn btn-ghost" id="audioCopy">Copiar</button><button class="btn btn-primary" id="audioSend">Enviar</button></div><div class="json-console" id="audioResponse">Listo.</div></div><div class="card endpoint-download-card vip-endpoint"><div><span class="method">GET</span><span class="pill-vip">VIP</span><h3 style="margin-top:10px">YouTube Video</h3><p class="muted">Descarga video MP4 en 144p–1080p. Solo VIP.</p></div><div class="field" style="margin-top:18px"><label>url</label><input id="videoUrl" placeholder="https://youtube.com/watch?v=..."></div><div class="field"><label>quality</label><select id="videoQuality"><option>144</option><option>240</option><option selected>360</option><option>480</option><option>720</option><option>1080</option></select></div><div class="endpoint-row" id="videoEndpoint"></div><div class="copy-row"><button class="btn btn-ghost" id="videoCopy">Copiar</button><button class="btn btn-primary" id="videoSend">Enviar</button></div><div class="json-console" id="videoResponse">Requiere una cuenta VIP.</div></div></div></div></div><script src="/js/app.js"></script><script src="/js/shell.js"></script><script src="/js/download.js"></script></body></html>
