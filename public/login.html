<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesion — Orbit API</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="orbit-bg">
  <svg viewBox="0 0 800 800">
    <ellipse class="orbit-ring" cx="400" cy="400" rx="320" ry="180" transform="rotate(-8 400 400)"></ellipse>
    <circle class="orbit-dot" cx="620" cy="270" r="4"></circle>
  </svg>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand" style="margin-bottom:24px">
      <svg viewBox="0 0 24 24" fill="none">
        <ellipse cx="12" cy="12" rx="10" ry="4.2" stroke="currentColor" stroke-width="1.4" transform="rotate(-18 12 12)"></ellipse>
        <circle cx="12" cy="12" r="2.6" fill="var(--accent)"></circle>
      </svg>
      Orbit API
    </div>
    <h1>Iniciar sesion</h1>
    <p class="muted" style="margin-bottom:24px">Accede a tu panel y gestiona tu API key.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="tu@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="error" class="error" style="display:none"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Entrar</button>
    </form>
    <p class="muted" style="margin-top:20px;text-align:center;font-size:14px">
      ¿No tienes cuenta? <a href="/register">Registrate</a>
    </p>
  </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
