<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesion — Orbit API</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 40px 0;
  }
  .auth-top {
    display: flex;
    justify-content: center;
    padding-top: 34px;
  }
  .switch-line {
    text-align: center;
    margin-top: 18px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .switch-line a {
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="orbit-bg">
  <svg viewBox="0 0 800 800">
    <ellipse class="orbit-ring" cx="400" cy="400" rx="200" ry="340" transform="rotate(18 400 400)"></ellipse>
    <ellipse class="orbit-ring" cx="400" cy="400" rx="280" ry="280"></ellipse>
  </svg>
</div>

<div class="auth-top wrap">
  <a class="brand" href="/">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <ellipse cx="12" cy="12" rx="10" ry="4.2" stroke="currentColor" stroke-width="1.4" transform="rotate(-18 12 12)"></ellipse>
      <circle cx="12" cy="12" r="2.6" fill="var(--accent)"></circle>
    </svg>
    Orbit API
  </a>
</div>

<div class="auth-screen">
  <div class="wrap-narrow">
    <div class="card">
      <h2 style="margin-bottom:6px">Inicia sesion</h2>
      <p class="muted" style="margin-bottom:22px;font-size:14px">Entra a tu dashboard y tu API key.</p>

      <div class="error-box" id="errorBox"></div>

      <form id="loginForm">
        <div class="field">
          <label>Correo</label>
          <input type="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="field">
          <label>Contrasena</label>
          <div class="field-row">
            <input type="password" name="password" id="passwordInput" placeholder="Tu contrasena" required>
            <button type="button" class="icon-btn" id="togglePassword">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Entrar</button>
      </form>

      <div class="divider-line"><span>o</span></div>

      <a href="/api/auth/github" class="btn btn-ghost btn-block">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.57.11.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.24 3.33.95.1-.74.4-1.24.72-1.53-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.07.78 2.16 0 1.56-.01 2.81-.01 3.19 0 .3.2.67.79.55A10.52 10.52 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg>
        Continuar con GitHub
      </a>

      <p class="switch-line">No tienes cuenta? <a href="/register">Registrate</a></p>
      <p class="switch-line"><a href="/forgot-password">¿Olvidaste tu contraseña?</a></p>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
