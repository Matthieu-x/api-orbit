<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — Orbit API</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://js.hcaptcha.com/1/api.js?onload=onHcaptchaReady&render=explicit" async defer></script>
<style>
  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 40px 0;
  }
  .auth-top {
    display: flex;
    justify-content: center;
    padding-top: 34px;
  }
  .captcha-box {
    margin-bottom: 18px;
    display: flex;
    justify-content: center;
  }
  .switch-line {
    text-align: center;
    margin-top: 18px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .switch-line a {
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="orbit-bg">
  <svg viewBox="0 0 800 800">
    <ellipse class="orbit-ring" cx="400" cy="400" rx="360" ry="150" transform="rotate(-12 400 400)"></ellipse>
    <ellipse class="orbit-ring" cx="400" cy="400" rx="280" ry="280"></ellipse>
  </svg>
</div>

<div class="auth-top wrap">
  <a class="brand" href="/">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <ellipse cx="12" cy="12" rx="10" ry="4.2" stroke="currentColor" stroke-width="1.4" transform="rotate(-18 12 12)"></ellipse>
      <circle cx="12" cy="12" r="2.6" fill="var(--accent)"></circle>
    </svg>
    Orbit API
  </a>
</div>

<div class="auth-screen">
  <div class="wrap-narrow">
    <div class="card">
      <h2 style="margin-bottom:6px">Crea tu cuenta</h2>
      <p class="muted" style="margin-bottom:22px;font-size:14px">Obten tu API key y 100 solicitudes gratis cada dia.</p>

      <div class="error-box" id="errorBox"></div>

      <form id="registerForm">
        <div class="field">
          <label>Nombre</label>
          <input type="text" name="name" placeholder="Tu nombre" required minlength="2">
        </div>
        <div class="field">
          <label>Correo</label>
          <input type="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="field">
          <label>Contrasena</label>
          <div class="field-row">
            <input type="password" name="password" id="passwordInput" placeholder="Minimo 6 caracteres" required minlength="6">
            <button type="button" class="icon-btn" id="togglePassword">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="captcha-box">
          <div id="captchaContainer"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Registrarme</button>
      </form>

      <p class="switch-line">Ya tienes cuenta? <a href="/login">Inicia sesion</a></p>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
