<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VIP — Orbit API</title><link rel="stylesheet" href="/css/style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></head><body><div class="orbit-bg"><svg viewBox="0 0 800 800"><ellipse class="orbit-ring" cx="400" cy="400" rx="300" ry="220" transform="rotate(-18 400 400)"></ellipse></svg></div><div id="shellMount"></div><div class="app-shell"><div class="wrap" style="padding-top:30px"><h1 class="section-title">Orbit VIP</h1><p class="muted" style="margin-bottom:22px">Compra tu acceso por WhatsApp y un administrador lo activa desde el panel.</p><div id="vipStatus" class="card" style="margin-bottom:18px">Cargando estado...</div><div class="vip-plans" id="plans"></div><div class="card" style="margin-top:18px"><h3>Cómo comprar</h3><ol class="vip-steps"><li>Elige un plan.</li><li>Escribe por WhatsApp al <strong>+504 9730-5037</strong>.</li><li>Envía tu comprobante y el correo de tu cuenta Orbit.</li><li>Un administrador activa tu VIP desde el panel.</li></ol></div></div></div><script src="/js/app.js"></script><script src="/js/shell.js"></script><script>
(async()=>{const user=await initShell("vip");if(!user)return;const plans=[{name:"VIP 7 días",days:7,price:25},{name:"VIP 30 días",days:30,price:60,hot:true},{name:"VIP 90 días",days:90,price:150}];const status=document.getElementById("vipStatus");status.innerHTML=user.is_admin?'<h3>Administrador</h3><p class="muted">Tu cuenta tiene acceso completo a los endpoints VIP.</p>':user.is_vip?`<h3><span class="pill-vip">VIP activo</span></h3><p class="muted" style="margin-top:8px">Vence: ${new Date(user.vip_expires_at).toLocaleString("es-HN")}</p>`:'<h3>Cuenta Free</h3><p class="muted" style="margin-top:8px">YouTube Audio es gratis. YouTube Video requiere VIP.</p>';document.getElementById("plans").innerHTML=plans.map(p=>{const text=`Hola, quiero comprar ${p.name} por L${p.price}. Mi correo Orbit es ${user.email}`;return `<div class="card vip-plan ${p.hot?'featured':''}"><span class="pill-vip">VIP</span><h3 style="margin-top:12px">${p.name}</h3><div class="vip-price">L${p.price}</div><p class="muted">Acceso a YouTube Video + ${p.days===7?1000:1000} solicitudes/día.</p><a class="btn btn-primary" target="_blank" rel="noopener" href="https://wa.me/50497305037?text=${encodeURIComponent(text)}">Comprar por WhatsApp</a></div>`}).join("")})();
</script></body></html>
